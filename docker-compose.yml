version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "sh", "-c", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 3 partitions per topic instead of 1 -- required for Phase 1's
      # multi-instance consumer group scaling to actually parallelize.
      KAFKA_CREATE_TOPICS: "clickstream:3:1,cart-events:3:1,transactions:3:1,ad-clicks:3:1,clickstream-dlq:1:1,cart-events-dlq:1:1,transactions-dlq:1:1,ad-clicks-dlq:1:1"
    volumes:
      - kafka-data:/kafka
    # NOTE: no docker.sock mount here -- that was the cause of the OCI
    # runtime mount corruption encountered earlier in this project. Kafka
    # never needs access to the Docker socket.

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED}
      GF_SMTP_HOST: ${GF_SMTP_HOST}
      GF_SMTP_USER: ${GF_SMTP_USER}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS}
    volumes:
      - grafana-data:/var/lib/grafana

  producer:
    build: ./producer
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      PRODUCER_DELAY_SECONDS: ${PRODUCER_DELAY_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - producer-logs:/app/logs

  consumer:
    build: ./consumer
    restart: unless-stopped
    depends_on:
      - kafka
      - mysql
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      LOG_LEVEL: ${LOG_LEVEL}
      ANOMALY_Z_THRESHOLD: ${ANOMALY_Z_THRESHOLD:-2.0}
      ANOMALY_LOOKBACK_WINDOWS: ${ANOMALY_LOOKBACK_WINDOWS:-20}
    volumes:
      - consumer-logs:/app/logs
    # Scale this service to 2+ instances for Phase 1's consumer-group demo:
    #   docker-compose up -d --scale consumer=2

  segmentation:
    build: ./segmentation
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      LOG_LEVEL: ${LOG_LEVEL}
      SEGMENTATION_INTERVAL_SECONDS: ${SEGMENTATION_INTERVAL_SECONDS:-60}
      MIN_TRANSACTIONS_TO_SCORE: ${MIN_TRANSACTIONS_TO_SCORE:-5}
    volumes:
      - segmentation-logs:/app/logs

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8001:8000"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      LOG_LEVEL: ${LOG_LEVEL}
    # Interactive docs at http://localhost:8001/docs once running.
    # Host port 8001 (not 8000) -- 8000 is already used by your
    # flowdeck-backend container on this machine.

volumes:
  kafka-data:
  mysql-data:
  grafana-data:
  producer-logs:
  consumer-logs:
  segmentation-logs: